<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Meter</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .readout { font-size: 2em; font-weight: bold; color: #007bff; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 15px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
    button:hover { background: #218838; }
    .status { margin-top: 10px; font-size: 0.9em; color: #6c757d; }
  </style>
</head>
<body>

  <h2>Web Light Meter</h2>

  <div class="card">
    <h3>Live Measurement</h3>
    <div>Raw Sensor: <span id="rawLux">0</span> lx</div>
    <div>Calibrated: <span id="calibratedLux" class="readout">0</span> lx</div>
  </div>

  <div class="card">
    <h3>Two-Point Calibration</h3>
    
    <label for="slope">Slope Multiplier (m):</label>
    <input type="number" id="slope" step="any" placeholder="1.0">

    <label for="offset">Zero Offset (b):</label>
    <input type="number" id="offset" step="any" placeholder="0.0">

    <button onclick="saveCalibration()">Save Calibration</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const STORAGE_KEY = 'lightmeter_calibration';
    
    // Default calibration parameters: Calibrated = (Raw * m) + b
    let calibration = { slope: 1.0, offset: 0.0 };

    // 1. Load saved calibration values from localStorage on startup
    function loadCalibration() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          calibration = JSON.parse(saved);
        } catch (e) {
          console.error('Failed to parse saved calibration settings', e);
        }
      }
      document.getElementById('slope').value = calibration.slope;
      document.getElementById('offset').value = calibration.offset;
    }

    // 2. Save updated calibration inputs to localStorage
    function saveCalibration() {
      const m = parseFloat(document.getElementById('slope').value);
      const b = parseFloat(document.getElementById('offset').value);

      calibration.slope = isNaN(m) ? 1.0 : m;
      calibration.offset = isNaN(b) ? 0.0 : b;

      localStorage.setItem(STORAGE_KEY, JSON.stringify(calibration));
      
      const statusEl = document.getElementById('status');
      statusEl.textContent = `Saved! Multiplier: ${calibration.slope}, Offset: ${calibration.offset}`;
      setTimeout(() => { statusEl.textContent = ''; }, 3000);
    }

    // 3. Process raw sensor data using active calibration values
    function processReading(rawLux) {
      document.getElementById('rawLux').textContent = rawLux.toFixed(1);
      
      // Calculate final measurement using linear equation y = mx + b
      const calibratedLux = (rawLux * calibration.slope) + calibration.offset;
      document.getElementById('calibratedLux').textContent = Math.max(0, calibratedLux).toFixed(1);
    }

    // 4. Initialize Sensor API
    loadCalibration();

    if ('AmbientLightSensor' in window) {
      try {
        const sensor = new AmbientLightSensor();
        sensor.addEventListener('reading', () => {
          processReading(sensor.illuminance);
        });
        sensor.addEventListener('error', (event) => {
          document.getElementById('status').textContent = 'Sensor error: ' + event.error.name;
        });
        sensor.start();
      } catch (err) {
        document.getElementById('status').textContent = 'Sensor access failed: ' + err.message;
      }
    } else {
      document.getElementById('status').textContent = 'AmbientLightSensor API not supported on this browser.';
    }
  </script>
</body>
</html>
