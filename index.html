<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Lux Estimator</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    .lux-val { font-size: 3.5rem; font-weight: bold; color: #00ffcc; margin: 20px 0; }
    video, canvas { display: none; }
    button { padding: 14px 28px; font-size: 1.1rem; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>Camera-Based Lux Meter</h2>
  <div class="lux-val" id="luxDisplay">-- lx</div>
  <button id="startBtn" onclick="initCamera()">Start Sensor Feed</button>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" width="64" height="64"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const luxDisplay = document.getElementById('luxDisplay');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: 64, height: 64 }
        });
        video.srcObject = stream;
        document.getElementById('startBtn').style.display = 'none';
        setInterval(calculateLuminance, 250);
      } catch (err) {
        alert("Camera access denied or unavailable: " + err.message);
      }
    }

    function calculateLuminance() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, 64, 64);
        const frame = ctx.getImageData(0, 0, 64, 64);
        const data = frame.data;
        let totalLuminance = 0;

        for (let i = 0; i < data.length; i += 4) {
          // Standard ITU-R BT.601 relative luminance formula
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const lum = (0.299 * r + 0.587 * g + 0.114 * b);
          totalLuminance += lum;
        }

        const avgLuminance = totalLuminance / (data.length / 4);
        
        // Uncalibrated relative scaling (0-255 scaled to an arbitrary lux curve)
        // This value is calibrated against a meter using your two-point setup
        const estimatedLux = Math.round(Math.pow(avgLuminance / 255, 2.2) * 12000);
        luxDisplay.innerText = estimatedLux.toLocaleString() + " lx";
      }
    }
  </script>
</body>
</html>
