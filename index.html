<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensor Test</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px 20px; }
    .val { font-size: 3.5rem; font-weight: bold; color: #00ffcc; margin: 30px 0; }
    button { padding: 16px 32px; font-size: 1.2rem; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 8px; }
    .log { margin-top: 25px; font-size: 0.9rem; color: #aaa; background: #1e1e1e; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>

  <h2>Light Sensor Hardware Test</h2>

  <div class="val" id="luxDisplay">-- lx</div>

  <button id="readBtn">Take Reading</button>

  <div class="log" id="statusLog">Status: Initializing...</div>

  <script>
    const luxDisplay = document.getElementById('luxDisplay');
    const statusLog = document.getElementById('statusLog');
    const readBtn = document.getElementById('readBtn');

    let latestLux = null;
    let sensor = null;

    // Check Web API Availability
    if ('AmbientLightSensor' in window) {
      try {
        sensor = new AmbientLightSensor();

        sensor.addEventListener('reading', () => {
          latestLux = sensor.illuminance;
          statusLog.innerText = "Status: Hardware sensor actively streaming data.";
        });

        sensor.addEventListener('error', (event) => {
          statusLog.innerText = "Sensor Error: " + event.error.name + " - " + event.error.message;
        });

        sensor.start();
      } catch (err) {
        statusLog.innerText = "Init Exception: " + err.message;
      }
    } else {
      statusLog.innerText = "Status: 'AmbientLightSensor' API is NOT exposed in this browser.";
    }

    // Button click updates display with the latest captured frame
    readBtn.addEventListener('click', () => {
      if (latestLux !== null) {
        luxDisplay.innerText = latestLux + " lx";
      } else if (!('AmbientLightSensor' in window)) {
        luxDisplay.innerText = "Unsupported";
        alert("Your browser does not expose the AmbientLightSensor API.");
      } else {
        luxDisplay.innerText = "No Data";
        alert("Sensor API exists, but no light reading has been emitted yet. Check browser flags or permissions.");
      }
    });
  </script>
</body>
</html>
